# One-off Jobs run by deploy.sh before the app rolls out. Jobs are immutable,
# so deploy.sh deletes the previous run before applying a new one.
---
# Creates waitless_owner / waitless_app as the Postgres superuser (SPEC §9).
# Idempotent; works the same against the in-cluster or a managed Postgres.
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-roles
  labels:
    app.kubernetes.io/name: bootstrap-roles
    waitless.dev/stage: bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bootstrap-roles
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the alpine image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:18.7-alpine
          command: ["bash", "/scripts/10-roles.sh"]
          envFrom:
            - secretRef:
                name: postgres-bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: postgres-roles
---
# Applies pending migrations as waitless_owner, the only role that may change the schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    waitless.dev/stage: migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: waitless-api
          command: ["node", "node_modules/@waitless/db/dist/migrate.js"]
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: waitless-secrets
                  key: MIGRATION_DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
