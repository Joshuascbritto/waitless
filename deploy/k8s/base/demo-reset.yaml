# Nightly demo reset (SPEC §13): deletes the demo businesses and seeds them
# again with fresh history, at 03:00 shop time. Personal data retention is a
# BullMQ job in the worker, not a CronJob: one implementation for compose and k8s.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-reset
  labels:
    app.kubernetes.io/name: demo-reset
    waitless.dev/stage: app
spec:
  schedule: "0 3 * * *"
  timeZone: America/Bahia
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demo-reset
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: seed
              image: waitless-api
              command: ["node", "dist/seed.js", "--reset-demo"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: waitless-secrets, key: DATABASE_URL } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 256Mi }
