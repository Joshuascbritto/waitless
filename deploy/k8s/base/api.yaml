# Fastify API: REST + SSE. Stateless, 2+ replicas; Redis pub/sub fans events
# out across them (ADR-0004), so any replica can serve any stream.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    waitless.dev/stage: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # SSE streams are closed in Fastify's preClose hook on SIGTERM; clients
      # reconnect (EventSource does it on its own) to another replica.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` in the official image
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: waitless-api
          ports:
            - name: http
              containerPort: 3001
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: waitless-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: waitless-secrets, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: waitless-secrets, key: REDIS_URL } }
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                { secretKeyRef: { name: waitless-secrets, key: VAPID_PUBLIC_KEY, optional: true } }
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                { secretKeyRef: { name: waitless-secrets, key: VAPID_PRIVATE_KEY, optional: true } }
            - name: VAPID_SUBJECT
              valueFrom:
                { secretKeyRef: { name: waitless-secrets, key: VAPID_SUBJECT, optional: true } }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Ready = Postgres and Redis answer. Not ready: no new traffic, not restarted.
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          # Live = the event loop answers. Doesn't check dependencies: a database
          # outage must not restart every replica at once.
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Let endpoints and the ingress drop this pod before it stops accepting.
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    waitless.dev/stage: app
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
# Voluntary disruptions (node drain, cluster upgrade) keep one replica serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    waitless.dev/stage: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
