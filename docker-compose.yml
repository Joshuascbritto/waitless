# Local development dependencies. App processes run on the host with `pnpm dev`.
# Ports bind to 127.0.0.1 only, so the database isn't reachable from your LAN.
#
# `docker compose --profile full up --build` also runs the app the way
# production does: migrations, web, TWO API replicas and Caddy routing
# /api to them, all on http://localhost:8080.
name: waitless

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-waitless}
      # Read by initdb/10-roles.sh, which creates the application roles.
      WAITLESS_OWNER_PASSWORD: ${WAITLESS_OWNER_PASSWORD:-owner}
      WAITLESS_APP_PASSWORD: ${WAITLESS_APP_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent directory (not .../data as in <= 17).
      - pgdata:/var/lib/postgresql
      # Init scripts run only when the data volume is empty. After changing
      # them: `docker compose down -v` (deletes local data) and start again.
      - ./deploy/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Profile "full": the app in containers, prod-like ------------------------

  migrate:
    profiles: [full]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: waitless-api:local
    # Applies pending migrations as the table owner, then exits.
    command: ["node", "node_modules/@waitless/db/dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://waitless_owner:${WAITLESS_OWNER_PASSWORD:-owner}@postgres:5432/${POSTGRES_DB:-waitless}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-1: &api
    profiles: [full]
    image: waitless-api:local
    pull_policy: never
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://waitless_app:${WAITLESS_APP_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-waitless}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://localhost:8080
      # Requests arrive through Caddy on the private Docker network.
      TRUST_PROXY: uniquelocal
      API_DOCS: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-2:
    <<: *api

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: waitless-web:local
    environment:
      # Server components call the API through Caddy, like the browser does.
      API_ORIGIN: http://caddy:8080
    depends_on:
      - api-1
      - api-2

  caddy:
    profiles: [full]
    image: caddy:2.11.9-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api-1
      - api-2
      - web

volumes:
  pgdata:
