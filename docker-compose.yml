# Local development dependencies. App processes run on the host with `pnpm dev`.
# Ports bind to 127.0.0.1 only, so the database isn't reachable from your LAN.
name: waitless

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-waitless}
      # Read by initdb/10-roles.sh, which creates the application roles.
      WAITLESS_OWNER_PASSWORD: ${WAITLESS_OWNER_PASSWORD:-owner}
      WAITLESS_APP_PASSWORD: ${WAITLESS_APP_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts the parent directory (not .../data as in <= 17).
      - pgdata:/var/lib/postgresql
      # Init scripts run only when the data volume is empty. After changing
      # them: `docker compose down -v` (deletes local data) and start again.
      - ./deploy/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
