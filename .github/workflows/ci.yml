name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs: a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        # Explicit bash adds pipefail: a kustomize error must fail the pipe.
        shell: bash
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform

      # Every overlay must render and match the Kubernetes API schemas
      # (CRDs such as cert-manager's come from the community catalog).
      # The prod overlay renders with its example secrets.
      - name: Render and validate
        run: |
          cd deploy/k8s/overlays/prod
          cp secrets.env.example secrets.env
          cp postgres.env.example postgres.env
          echo '{"auths":{}}' > ghcr.dockerconfigjson
          cd "$GITHUB_WORKSPACE"
          for overlay in local prod prod/cluster; do
            echo "::group::$overlay"
            kubectl kustomize "deploy/k8s/overlays/$overlay" | ./kubeconform -strict -summary \
              -kubernetes-version 1.37.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
            echo "::endgroup::"
          done

      - name: Check the deploy script
        run: bash -n deploy/k8s/deploy.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The prod-like stack: Caddy, two API replicas, worker, web (SPEC §14).
      # Images build with the release workflow's layer cache.
      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # The local checkout as build context (the default is the Git URL).
          source: .
          files: docker-compose.yml
          targets: migrate,web
          load: true
          set: |
            migrate.cache-from=type=gha,scope=api
            web.cache-from=type=gha,scope=web
      - name: Start the stack
        run: |
          docker compose --profile full up -d --no-build
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health/ready >/dev/null && exit 0
            sleep 2
          done
          docker compose --profile full ps
          exit 1

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waitless/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Stack logs
        if: failure()
        run: docker compose --profile full logs --no-color --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
