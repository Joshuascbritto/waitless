name: Feature request
description: Suggest something Waitless should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem (customer, staff, owner) and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Alternatives you considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked "Future work and non-goals" in the README.
