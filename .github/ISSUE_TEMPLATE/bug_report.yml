name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /q/barbearia-demo/haircut on a phone
        2. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Demo, local `pnpm dev`, compose `full` profile or Kubernetes; browser and device.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, cookies and personal data first.
      render: text
